name: Osaka cloud acceptance
on:
  push:
    branches: ['codex/osaka-cloud-*']
permissions:
  contents: read
jobs:
  anonymous-once:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install chromium --with-deps
      - name: Query once without account or notification credentials
        run: python scripts/cloud_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osaka-cloud-acceptance
          path: data/cloud-acceptance.json
