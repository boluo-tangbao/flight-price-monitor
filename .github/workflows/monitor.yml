name: Flight Price Monitor


on:
  schedule:
    - cron: '25 8,13,19,0 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: flight-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    environment: ctrip-cloud
    if: github.event_name == 'workflow_dispatch' || vars.FLIGHT_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Require completed cloud and baggage acceptance
        env:
          ENABLED: ${{ vars.FLIGHT_MONITOR_ENABLED }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "Cloud and two-leg baggage verification pending; no airline request sent."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install chromium --with-deps
      - uses: actions/cache/restore@v4
        with:
          path: data/prices.db
          key: flight-db-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: flight-db-v2-${{ github.ref_name }}-
      - name: Query configured Shanghai Osaka round trip once
        env:
          CTRIP_STORAGE_STATE_B64: ${{ secrets.CTRIP_STORAGE_STATE_B64 }}
          SERVERCHAN_SEND_KEY: ${{ secrets.SERVERCHAN_SEND_KEY || secrets.SERVERCHAN_KEY }}
        run: python main.py -c config.monitor.yaml --once
        timeout-minutes: 3
      - name: Export status
        if: always()
        run: |
          if [ -f data/prices.db ]; then python scripts/collection_status.py; fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/prices.db
          key: flight-db-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-status
          path: data/collection-status.json
